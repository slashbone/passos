# ==============================================
# CONFIGURAÇÕES DO PROJETO STEPS V1.4
# ==============================================

# Configurações do Servidor
server.port=8080
server.servlet.context-path=/

# ==============================================
# CONFIGURAÇÕES SQL SERVER NO PODMAN
# ==============================================
# 🔧 Estas configurações conectam ao SQL Server rodando no Podman
# 📋 Para criar o container: .\setup-sqlserver-podman.bat

# URL de Conexão SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=steps_db;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=StepsPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================================
# CONFIGURAÇÕES JPA / HIBERNATE
# ==============================================
# Configurações para SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ==============================================
# CONFIGURAÇÕES SPRING BOOT ACTUATOR
# ==============================================
# Habilita todos os endpoints do Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Informações da aplicação
info.app.name=Projeto Steps V1.4
info.app.description=Sistema CRUD completo com SQL Server no Podman
info.app.version=1.4.0
info.app.encoding=UTF-8
info.app.java.version=21

# ==============================================
# CONFIGURAÇÕES DE LOG
# ==============================================
# Logs detalhados para desenvolvimento
logging.level.com.projeto.steps=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==============================================
# CONFIGURAÇÕES CORS (Para Frontend Separado)
# ==============================================
# Permite requisições do frontend separado
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true