# ========================================
# CONFIGURAÇÕES DA APLICAÇÃO SPRING BOOT
# ========================================

# EXPLICAÇÃO DETALHADA PARA INICIANTES:
# Este arquivo contém todas as configurações da nossa aplicação Spring Boot.
# O Spring Boot lê estas configurações automaticamente na inicialização.
# Cada linha configura um aspecto específico da aplicação.

# ========================================
# CONFIGURAÇÕES DO SERVIDOR WEB
# ========================================

# PORTA DO SERVIDOR
# Define em qual porta a aplicação vai rodar
# Padrão: 8080, mas pode ser alterado se a porta estiver ocupada
server.port=8080

# CONTEXTO DA APLICAÇÃO
# Define o caminho base da aplicação na URL
# Vazio significa que a aplicação estará disponível em http://localhost:8080/
# Se fosse "/api", estaria em http://localhost:8080/api/
server.servlet.context-path=

# CONFIGURAÇÕES DE SESSÃO
# Define timeout de sessão (em segundos)
server.servlet.session.timeout=30m

# ========================================
# CONFIGURAÇÕES DO ACTUATOR
# ========================================

# HABILITA TODOS OS ENDPOINTS DO ACTUATOR
# Por padrão, apenas /health é exposto por segurança
# Esta configuração expõe todos os endpoints para desenvolvimento/monitoramento
management.endpoints.web.exposure.include=*

# CAMINHO BASE DOS ENDPOINTS DO ACTUATOR
# Define onde os endpoints do Actuator estarão disponíveis
# Com esta configuração: http://localhost:8080/actuator/health
management.endpoints.web.base-path=/actuator

# DETALHES DO HEALTH CHECK
# always: Sempre mostra detalhes completos do health check
# when_authorized: Só mostra detalhes se autorizado
# never: Nunca mostra detalhes
management.endpoint.health.show-details=always

# HABILITA COMPONENTES DE HEALTH CHECK
# Verifica automaticamente saúde de bancos de dados, caches, etc.
management.endpoint.health.show-components=always

# INFORMAÇÕES CUSTOMIZADAS DA APLICAÇÃO
# Estas informações aparecerão no endpoint /actuator/info
management.info.env.enabled=true

# ========================================
# INFORMAÇÕES DA APLICAÇÃO
# ========================================

# METADADOS DA APLICAÇÃO
# Estas informações são exibidas no endpoint /actuator/info
info.app.name=Steps Backend
info.app.description=Backend Spring Boot para o Projeto Steps V1 - Interface Web com mensagem de boas-vindas
info.app.version=1.0.0
info.app.author=Projeto Steps V1
info.app.contact=desenvolvimento@projetosteps.com

# INFORMAÇÕES TÉCNICAS
info.java.version=@java.version@
info.spring-boot.version=@project.parent.version@
info.build.timestamp=@timestamp@

# ========================================
# CONFIGURAÇÕES DE LOGGING
# ========================================

# NÍVEL DE LOG DA APLICAÇÃO
# TRACE < DEBUG < INFO < WARN < ERROR
# INFO: Mostra informações importantes sem ser muito verboso
logging.level.com.projeto.steps=INFO

# NÍVEL DE LOG DO SPRING BOOT
# Reduz logs desnecessários do framework
logging.level.org.springframework=WARN

# NÍVEL DE LOG DO ACTUATOR
# INFO para ver quando endpoints são acessados
logging.level.org.springframework.boot.actuate=INFO

# FORMATO DO LOG
# Define padrão de exibição dos logs no console
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{15} - %msg%n

# ========================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# ========================================

# HABILITA DEVTOOLS (DESENVOLVIMENTO)
# Permite hot-reload da aplicação quando código é alterado
spring.devtools.restart.enabled=true

# ARQUIVOS QUE DEVEM SER IGNORADOS NO HOT-RELOAD
# Evita restart desnecessário quando estes arquivos mudam
spring.devtools.restart.exclude=static/**,public/**,templates/**

# LIVERELOAD (ATUALIZAÇÃO AUTOMÁTICA DO BROWSER)
# Quando habilitado, browser se atualiza automaticamente quando código muda
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729

# ========================================
# CONFIGURAÇÕES DE CORS (FRONTEND)
# ========================================

# CORS JÁ CONFIGURADO NO CONTROLLER
# Mas pode ser configurado globalmente aqui se necessário:
# spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
# spring.web.cors.allowed-headers=*

# ========================================
# CONFIGURAÇÕES DE BANNER
# ========================================

# LOCALIZAÇÃO DO BANNER CUSTOMIZADO
# Se você quiser um banner personalizado na inicialização
# spring.banner.location=classpath:banner.txt

# MODO DO BANNER
# console: Mostra no console
# log: Mostra no arquivo de log  
# off: Desabilita o banner
spring.main.banner-mode=console

# ========================================
# CONFIGURAÇÕES DE CACHE
# ========================================

# DESABILITA CACHE PARA DESENVOLVIMENTO
# Em produção, cache deve ser habilitado para performance
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# ========================================
# CONFIGURAÇÕES DE PROFILE
# ========================================

# PROFILE ATIVO
# dev: Desenvolvimento (logs detalhados, devtools ativo)
# prod: Produção (logs reduzidos, otimizações ativadas)
# test: Testes (configurações específicas para testes)
spring.profiles.active=dev